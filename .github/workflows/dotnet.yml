name: Build Mods

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Detect changed projects
      id: detect
      run: |
        echo "Detecting changed projects..."
        CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d'/' -f1 | sort | uniq)
        echo "Changed projects: $CHANGED"
        echo "changed_projects=$CHANGED" >> $GITHUB_OUTPUT

    - name: Build and zip changed projects
      run: |
        for proj in ${{ steps.detect.outputs.changed_projects }}; do
          if [ -f "$proj/$proj.csproj" ]; then
            echo "Building $proj..."
            dotnet restore "$proj/$proj.csproj"
            dotnet build "$proj/$proj.csproj" --configuration Release --no-restore

            echo "Zipping $proj..."
            mkdir -p ./artifacts/$proj
            zip -r ./artifacts/$proj/$proj.zip "$proj/bin/Release/net6.0"
          else
            echo "Skipping $proj, no csproj found"
          fi
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Project-Mod-ZIP
        path: ./artifacts/**
